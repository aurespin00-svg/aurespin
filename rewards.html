<!DOCTYPE html>
<html>
<head>
<title>AureSpin – Rewards</title>
<style>
body { background:#020617;color:white;text-align:center;font-family:Arial; }
.card { background:#111827;padding:20px;margin:20px;border-radius:15px; }
button { padding:10px 20px;border-radius:20px;background:#00f7ff;border:none; }
</style>
</head>

<body>

<h1>🎁 Rewards</h1>
<p>Your Points: <span id="points">0</span></p>

<div class="card">
  <h3>🎉 Bonus Spin</h3>
  <p>Cost: 100 points</p>
  <button onclick="redeem(100)">Redeem</button>
</div>

<script>
let points = Number(localStorage.getItem("points")) || 0;
document.getElementById("points").textContent = points;

function redeem(cost) {
  if (points < cost) {
    alert("Not enough points");
    return;
  }
  points -= cost;
  let spins = Number(localStorage.getItem("spins")) || 0;
  spins++;

  localStorage.setItem("points", points);
  localStorage.setItem("spins", spins);

  alert("🎰 Bonus spin added!");
  location.reload();
}
</script>

<script src="layout.js"></script>  

</body>
</html>
