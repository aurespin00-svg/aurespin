<title>AureSpin Rewards – Unlock Bonuses with Points</title>
<meta name="description" content="View your AureSpin rewards and see what bonuses you can unlock using your virtual points.">
  
<link rel="manifest" href="manifest.json">
  
</head>
<body>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

<script src="layout.js"></script>  

<h1>🎁 Your Rewards</h1>

<h2>Unlock Bonuses with Your Points</h2>

<ul id="rewardList"></ul>

<script>
const points = parseInt(localStorage.getItem("points") || 0);

const rewards = [
  { pts: 500, label: "🎉 Bonus Spins" },
  { pts: 1000, label: "💎 Premium Reward" },
  { pts: 2000, label: "🏆 VIP Status" }
];

const list = document.getElementById("rewardList");

rewards.forEach(r => {
  const li = document.createElement("li");

  if (points >= r.pts) {
    li.innerHTML = `${r.label} — ✅ Unlocked`;
    li.style.color = "gold";
  } else {
    li.innerHTML = `${r.label} — 🔒 Locked (${r.pts} pts)`;
    li.style.opacity = "0.6";
  }

  list.appendChild(li);
});
</script>
