<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AureSpin</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0f1c;
    color:white;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:#11162a;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:gold;
}

.balance{
    font-size:14px;
    color:#00ffcc;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:15px;
}

.card{
    background:#141a2e;
    border-radius:15px;
    padding:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,255,0.2);
}

.card h3{
    color:gold;
}

.card button{
    margin-top:10px;
    padding:6px 12px;
    border:none;
    border-radius:6px;
    background:gold;
    font-weight:bold;
    cursor:pointer;
}

/* SPIN MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:#11162a;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

#wheel{
    width:200px;
    height:200px;
    border-radius:50%;
    margin:20px auto;
    border:6px solid gold;
    transition:transform 4s ease-out;
    background:conic-gradient(
        gold 0deg 60deg,
        #1e90ff 60deg 120deg,
        #32cd32 120deg 180deg,
        #ff4e50 180deg 240deg,
        #ff69b4 240deg 300deg,
        #ffa500 300deg 360deg
    );
}

.spin-btn{
    padding:8px 20px;
    border:none;
    border-radius:20px;
    background:gold;
    font-weight:bold;
    cursor:pointer;
}

.close{
    margin-top:10px;
    font-size:12px;
    cursor:pointer;
    color:#aaa;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">AureSpin</div>
    <div class="balance">Points: <span id="points">100</span></div>
</div>

<div class="cards">
    <div class="card">
        <h3>🎡 Spin Wheel</h3>
        <p>Spin and win points instantly.</p>
        <button onclick="openSpin()">Play</button>
    </div>
</div>

<!-- SPIN MODAL -->
<div class="modal" id="spinModal">
    <div class="modal-content">
        <h3>Spin the Wheel</h3>
        <div id="wheel"></div>
        <button class="spin-btn" onclick="spin()">Spin (10 pts)</button>
        <div id="result"></div>
        <div class="close" onclick="closeSpin()">Close</div>
    </div>
</div>

<script>
let points = 100;
let spinning = false;
const rewards = [5,10,15,20,25,50];

function openSpin(){
    document.getElementById("spinModal").style.display="flex";
}

function closeSpin(){
    document.getElementById("spinModal").style.display="none";
}

function spin(){
    if(spinning || points < 10) return;

    spinning = true;
    points -= 10;
    document.getElementById("points").innerText = points;

    const index = Math.floor(Math.random()*rewards.length);
    const reward = rewards[index];
    const rotation = 360*5 + (index*60);

    document.getElementById("wheel").style.transform =
        "rotate("+rotation+"deg)";

    setTimeout(()=>{
        points += reward;
        document.getElementById("points").innerText = points;
        document.getElementById("result").innerText =
            "You won "+reward+" points!";
        spinning=false;
    },4000);
}
</script>

</body>
</html>
