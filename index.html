<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AureSpin</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0f1c;
    color:white;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:#11162a;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:gold;
}

.auth-btns button{
    margin-left:8px;
    padding:6px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.login{background:#1e2a4d;color:white;}
.register{background:gold;color:black;font-weight:bold;}

/* BANNER */
.banner{
    margin:15px;
    padding:20px;
    border-radius:15px;
    background:linear-gradient(135deg,#1c2b55,#0d1b3d);
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,255,0.3);
}

.banner h2{
    color:gold;
}

/* CATEGORIES */
.categories{
    display:flex;
    overflow-x:auto;
    padding:10px;
}

.categories button{
    margin-right:10px;
    padding:8px 16px;
    border:none;
    border-radius:20px;
    background:#1e2a4d;
    color:white;
    cursor:pointer;
}

.categories button.active{
    background:gold;
    color:black;
    font-weight:bold;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:15px;
}

.card{
    background:#141a2e;
    border-radius:15px;
    padding:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,255,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card h3{
    color:gold;
}

.card button{
    margin-top:10px;
    padding:6px 12px;
    border:none;
    border-radius:6px;
    background:gold;
    font-weight:bold;
    cursor:pointer;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#11162a;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
}

.bottom-nav div{
    text-align:center;
    font-size:12px;
    color:white;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">AureSpin</div>
    <div class="auth-btns">
        <button class="login">Sign In</button>
        <button class="register">Register</button>
    </div>
</div>

<div class="banner">
    <h2>🎉 Get 100 Points Free!</h2>
    <p>Spin daily and earn exciting rewards.</p>
</div>

<div class="categories">
    <button class="active">All</button>
    <button>Spin</button>
    <button>Popular</button>
    <button>Rewards</button>
</div>

<div class="cards">

    <div class="card">
        <h3>🎡 Spin Wheel</h3>
        <p>Spin and win points instantly.</p>
        <button onclick="alert('Spin Game Coming Next Phase')">Play</button>
    </div>

    <div class="card">
        <h3>🎁 Daily Bonus</h3>
        <p>Claim your daily reward.</p>
        <button onclick="alert('Daily Bonus Coming')">Claim</button>
    </div>

    <div class="card">
        <h3>💎 Reward Chest</h3>
        <p>Open and win surprise points.</p>
        <button onclick="alert('Chest Feature Coming')">Open</button>
    </div>

    <div class="card">
        <h3>🔥 Lucky Draw</h3>
        <p>Enter weekly big prize draw.</p>
        <button onclick="alert('Lucky Draw Coming')">Enter</button>
    </div>

</div>

<div class="bottom-nav">
    <div>🏠<br>Home</div>
    <div>🎁<br>Rewards</div>
    <div>💰<br>Wallet</div>
    <div>👤<br>Profile</div>
</div>

</body>
</html>
