<style>

.game-section {
  text-align: center;
  padding: 60px 20px;
}

.stats p {
  font-size: 18px;
  margin: 10px 0;
}

#result {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
}

.popup {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.popup-content {
  background: #111827;
  padding: 30px;

  color: white;
}    

body {
  background: radial-gradient(circle at center, #111827, #000);
  color: white;
  font-family: Arial, sans-serif;
}

.wheel-container {
  position: relative;
  display: flex;
  justify-content: center;
  margin: 40px 0;
}

.wheel {
  width: 260px;
  height: 260px;
  border-radius: 50%;
  border: 10px solid gold;
  position: relative;
  background: conic-gradient(
    #ff4d4d 0deg 51deg,
    #4dff4d 51deg 102deg,
    #4d4dff 102deg 153deg,
    #ffff4d 153deg 204deg,
    #ff4dff 204deg 255deg,
    #4dffff 255deg 306deg,
    gold 306deg 360deg
  );
  box-shadow: 0 0 25px gold, 0 0 50px orange;
  transition: transform 3s cubic-bezier(.17,.67,.83,.67);
  animation: glowPulse 2s infinite;
}

.pointer {
  position: absolute;
  top: -15px;
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 25px solid gold;
  z-index: 10;
}

.spin-btn {
  padding: 15px 50px;
  font-size: 20px;
  font-weight: bold;
  background: linear-gradient(45deg, gold, orange);
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 0 15px gold;
  transition: 0.3s ease;
}

.spin-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px orange;
}

.progress-bar {
  width: 80%;
  height: 20px;
  background: #333;
  margin: 15px auto;
  border-radius: 20px;
  overflow: hidden;
}

#progress {
  height: 100%;
  width: 0%;
  background: gold;
  transition: width 0.5s ease;
}

.leaderboard {
  list-style: none;
  padding: 0;
  margin-top: 15px;
}

.leaderboard li {
  margin: 5px 0;
  font-size: 14px;
}

@keyframes glowPulse {
  0% { box-shadow: 0 0 20px gold; }
  50% { box-shadow: 0 0 40px orange; }
  100% { box-shadow: 0 0 20px gold; }
}

.wheel {
  animation: glowPulse 2s infinite;
}

@keyframes bigFlash {
  0% { transform: scale(1); color: white; }
  50% { transform: scale(1.3); color: gold; }
  100% { transform: scale(1); color: white; }
}    

.wheel-labels {
  position: absolute;
  width: 260px;
  height: 260px;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
}

.wheel-labels span {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: rotate(calc(51.4286deg * var(--i))) translate(0, -110px) rotate(calc(-51.4286deg * var(--i)));
  transform-origin: center;
  font-size: 14px;
  font-weight: bold;
  color: black;
}
