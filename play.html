<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AureSpin – Play</title>

<style>
body {
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}
button {
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:25px;
  background:gold;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🎰 Spin the Wheel</h1>
<p>Spins Left: <span id="spins">3</span></p>
<p>Points: <span id="points">0</span></p>

<button onclick="spin()">SPIN</button>

<script>
let spins = Number(localStorage.getItem("spins")) || 3;
let points = Number(localStorage.getItem("points")) || 0;

document.getElementById("spins").textContent = spins;
document.getElementById("points").textContent = points;

function spin() {
  if (spins <= 0) {
    alert("No spins left. Come back tomorrow!");
    return;
  }

  const reward = Math.floor(Math.random() * 50) + 10;
  points += reward;
  spins--;

  localStorage.setItem("points", points);
  localStorage.setItem("spins", spins);

  document.getElementById("points").textContent = points;
  document.getElementById("spins").textContent = spins;

  alert(`🎉 You won ${reward} points!`);
}
</script>

</body>
</html>
