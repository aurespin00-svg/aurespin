<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AureSpin - Play</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b1120;
  color:white;
  padding-bottom:80px;
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#111827;
}

.balance{
  background:#1f2937;
  padding:8px 14px;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 0 10px #00f7ff;
}

.bonus-btn{
  background:gold;
  color:black;
  padding:8px 14px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
}

/* BANNERS */
.top-banners{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:15px;
}

.banner{
  min-width:220px;
  background:linear-gradient(45deg,#ff9800,gold);
  padding:20px;
  border-radius:15px;
  font-weight:bold;
  color:black;
}

/* ANNOUNCEMENT */
.announcement{
  background:#1e293b;
  padding:10px;
  text-align:center;
  font-size:14px;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:15px;
}

.categories button{
  background:#1e293b;
  border:none;
  padding:8px 16px;
  border-radius:20px;
  color:white;
  cursor:pointer;
}

.categories .active{
  background:#7c3aed;
}

/* SECTION TITLE */
.section-title{
  padding:0 15px;
  display:flex;
  justify-content:space-between;
}

/* GAME GRID */
.game-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  padding:15px;
}

.game-card{
  background:#111827;
  border-radius:15px;
  overflow:hidden;
  text-align:center;
  transition:0.3s;
  position:relative;
}

.game-card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00f7ff;
}

.game-thumb{
  height:120px;
  background:linear-gradient(45deg,#00f7ff,#7c3aed);
}

.game-card p{
  padding:10px;
  font-weight:bold;
}

.badge{
  position:absolute;
  top:10px;
  right:10px;
  background:red;
  padding:4px 8px;
  border-radius:12px;
  font-size:12px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  font-size:12px;
}

.bottom-nav a{
  text-align:center;
  color:white;
  text-decoration:none;
}

.bottom-nav a.active{
  color:gold;
}

</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="balance">🪙 <span id="balance">0</span> pts</div>
  <div class="bonus-btn" onclick="claimBonus()">🎁 Bonus</div>
</div>

<!-- BANNERS -->
<div class="top-banners">
  <div class="banner">🔥 Daily Spin Event</div>
  <div class="banner">💎 Jackpot Challenge</div>
  <div class="banner">🎁 Free Bonus Spins</div>
</div>

<!-- ANNOUNCEMENT -->
<div class="announcement">
📢 Play games to earn points and unlock rewards!
</div>

<!-- CATEGORIES -->
<div class="categories">
  <button class="active">All</button>
  <button>Spin</button>
  <button>Popular</button>
  <button>New</button>
</div>

<h3 class="section-title">🎰 Spin Games <span>4</span></h3>

<!-- GAME GRID -->
<div class="game-grid">

  <div class="game-card" onclick="openGame('wheel')">
    <div class="badge">HOT</div>
    <div class="game-thumb"></div>
    <a href="superspin.html"</a>
    <p>Super Spin</p>
  </div>

  <div class="game-card" onclick="openGame('wheel')">
    <div class="game-thumb"></div>
     <a href="freespin.html"</a>
    <p>Free Spin</p>
  </div>

  <div class="game-card" onclick="openGame('wheel')">
    <div class="badge">NEW</div>
    <div class="game-thumb"></div>
    <a href="jackpotspin.html"</a>
    <p>Jackpot Spin</p>
  </div>

  <div class="game-card" onclick="openGame('wheel')">
    <div class="game-thumb"></div>
    <a href="cashrush.html"</a>
    <p>Cash Rush</p>
  </div>

  <div class="game-card" onclick="openGame('wheel')">
    <div class="game-thumb"></div>
    <a href="spinwheel.html"</a>
    <p>Spin Wheel</p>
  </div>
  
  <div class="game-card" onclick="openGame('wheel')">
    <div class="game-thumb"></div>
    <a href="scratchcard.html"</a>
    <p>Scratch Card</p>
  </div>

  <div class="game-card" onclick="openGame('wheel')">
    <div class="game-thumb"></div>
    <a href="freespin.html"</a>
    <p>Slots</p>
  </div>

  <div class="game-card" onclick="openGame('wheel')">
    <div class="game-thumb"></div>
    <a href="diceroll.html"</a>
    <p>Dice Roll</p>
  </div>

  <div class="game-card" onclick="openGame('wheel')">
    <div class="game-thumb"></div>
    <a href="coinflip.html"</a>
    <p>Coin Flip</p>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="index.html">🏠<br>Home</a>
  <a href="play.html" class="active">🎰<br>Play</a>
  <a href="#">🎁<br>Rewards</a>
  <a href="#">👤<br>Profile</a>
</div>

<script>

// Load balance
let balance = localStorage.getItem("points") || 0;
document.getElementById("balance").textContent = balance;

// Open Game
function openGame(game){
  window.location.href = "wheel.html"; 
}

// Bonus system
function claimBonus(){
  balance = parseInt(balance) + 100;
  localStorage.setItem("points", balance);
  document.getElementById("balance").textContent = balance;
  alert("🎁 100 Bonus Points Added!");
}

let today=new Date().toLocaleDateString();

let last=localStorage.getItem("daily");

if(last!==today){

let points=parseInt(localStorage.getItem("points")||0);

points+=100;

localStorage.setItem("points",points);

localStorage.setItem("daily",today);

alert("🎁 Daily reward: 100 points");

}

</script>

</body>
</html>
